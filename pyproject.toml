[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bambu-mcp"
version = "0.1.0"
description = "Monitoring service and MCP server for a Bambu Lab P2S 3D printer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2",
    "httpx",
    "mcp",
    "uvicorn",
    "tzdata>=2026.6",
    "av>=19.0.2",
    "pillow>=13.0.0",
    "starlette>=1.10.0",
    "python-multipart>=0.0.34",
]

[project.scripts]
bambu-service = "bambu_mcp.service:main"
slice-agent = "slice_agent.app:main"
bambu-mcp = "bambu_mcp.upload:main"
bambu-printer-check = "bambu_mcp.printer_check:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bambu_mcp", "src/slice_agent", "src/bambu_profiles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "synthetic: test uses a hand-built payload, not a captured P2S report",
]
