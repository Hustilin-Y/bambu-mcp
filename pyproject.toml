[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bambu-mcp"
version = "0.1.0"
description = "Monitoring service and MCP server for a Bambu Lab P2S 3D printer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2",
    "httpx",
    "mcp",
    "uvicorn",
]

[project.scripts]
bambu-service = "bambu_mcp.service:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bambu_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "synthetic: test uses a hand-built payload, not a captured P2S report",
]
